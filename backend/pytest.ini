[pytest]
# The app imports itself as `backend.*`, so the project root (this file's parent) must be importable.
pythonpath = ..
testpaths = tests

# Coverage on every run, with branch coverage. Skip it with `pytest --no-cov`.
addopts =
    --cov=backend
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Applied by pytest-env before backend.config is imported. load_dotenv() never overrides
# variables that are already set, so these win over anything in the real .env file.
env =
    DATABASE_URL=sqlite:///:memory:
    OPENAI_API_KEY=
    SEMANTIC_SCHOLAR_API_KEY=
